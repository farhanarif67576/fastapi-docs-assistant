[project]
name = "fastapi-docs-assistant"
version = "1.0.0"
description = "A RAG-based assistant that answers questions about FastAPI documentation"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.25.0",
    "psycopg2-binary>=2.9.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "python-dotenv>=1.0.0",
    "scrapy>=2.17.0",
]

[project.optional-dependencies]
# Extra tools for the ingestion pipeline (scrape, chunk, embed, store)
# Install with: uv sync --extra ingest
ingest = [
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "sentence-transformers>=2.2.0",
    "onnxruntime>=1.15.0",
]

# These are installed by uv sync by default UNLESS --no-dev is passed.
# Docker uses --no-dev so these heavy packages are NEVER pulled into the image.
[tool.uv]
dev-dependencies = [
    "jupyter>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "sentence-transformers>=2.2.0",
    "onnxruntime>=1.15.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
